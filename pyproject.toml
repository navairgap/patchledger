[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchledger"
version = "0.1.0"
description = "An evidence-first, open-source security finding and remediation verification platform for developers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "navairgap" }]
keywords = [
    "cybersecurity",
    "application-security",
    "vulnerability-scanner",
    "devsecops",
    "security-automation",
    "sarif",
    "vulnerability-management",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
patchledger = "patchledger.cli:main"

[project.urls]
Homepage = "https://github.com/navairgap/patchledger"
Repository = "https://github.com/navairgap/patchledger"
Issues = "https://github.com/navairgap/patchledger/issues"
Changelog = "https://github.com/navairgap/patchledger/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/patchledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "RUF"]
ignore = [
    "S603",  # subprocess with explicit argv list is our documented pattern
    "S607",  # partial-path executable lookup is resolved via shutil.which
    "B008",  # typer.Option/Argument calls in defaults are the required Typer idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # assertions and dummy secrets in fixtures are intentional

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["patchledger"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
