<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="PatchLedger — Find it. Understand it. Fix it. Prove it.">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#8a94a6" opacity="0.13"/>
    </pattern>
    <linearGradient id="dotfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <mask id="dotmask">
      <rect width="1200" height="300" fill="url(#dotfade)"/>
    </mask>
  </defs>

  <rect width="1200" height="300" rx="16" fill="#0b0e14"/>
  <rect width="1200" height="300" rx="16" fill="url(#dots)" mask="url(#dotmask)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="15.5" fill="none" stroke="#232c3e"/>

  <!-- ledger mark -->
  <g transform="translate(88,96)">
    <rect width="48" height="48" rx="11" fill="#155c33"/>
    <rect x="10" y="10" width="11" height="28" rx="2.5" fill="#63d18b"/>
    <rect x="27" y="10" width="11" height="28" rx="2.5" fill="#2e7d4f"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="158" y="136" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="54" font-weight="760" letter-spacing="-1.6" fill="#eef1f6">PatchLedger</text>
  <text x="159" y="180" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" fill="#8a94a6">Find it. Understand it. Fix it. <tspan fill="#63d18b" font-weight="600">Prove it.</tspan></text>

  <!-- hairline separator + mono baseline -->
  <line x1="90" y1="216" x2="620" y2="216" stroke="#1d2433"/>
  <text x="90" y="246" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#5c6678" letter-spacing="0.6">evidence-first remediation verification · local-first · no AI API · MIT</text>

  <!-- verified chip -->
  <g transform="translate(866,118)">
    <rect width="248" height="64" rx="12" fill="#10151f" stroke="#2a7a4b"/>
    <text x="24" y="29" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#63d18b">✓ FIXED VERIFIED</text>
    <text x="24" y="50" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13.5" fill="#5c6678">fp2:56e15c… · coverage ok</text>
  </g>
  <text x="866" y="210" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#5c6678">proof, not a guess —</text>
  <text x="866" y="232" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#5c6678">every claim has a test</text>
</svg>
